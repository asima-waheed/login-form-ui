<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!--blob div-->
    <div class="blob"></div>

        <!--orbit div-->
        <div class="orbit"></div>

            <!--login form div-->
            <div class="login">

                <h2 class="main-heading">Login Form</h2>

                <h2>Welcome back!</h2>

                <h3>Lets get you logged in!</h3>

                    <!--login form-->
                    <form class="form">

                        <!--textbox div-->
                        <div class="textbox">

                            <input required type="email" />
                            <label>Email</label>

                        </div>

                            <!--textbox div-->
                            <div class="textbox">

                                <input required type="password" />
                                <label>Password</label>

                            </div>

                                <!--Login button-->
                                <button type="submit">Login</button>

                    </form>

                                <!--forgot password link-->
                                <a>Forgot password?</a>

                                <!--register link-->
                                <p class="footer">Don't have an account? <a>Register!</a></p>

            </div>

</body>
</html>
